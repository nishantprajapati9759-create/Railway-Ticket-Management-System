.eticket-box { border: 2px dashed #15803d; background: #f0fdf4; border-radius: 12px; padding: 14px 16px; }

      else if (k === 'style') node.style.cssText = attrs[k];

var seatTag = selectedSeats.length > 0 ? ('S1-' + selectedSeats[i]) : 'Passenger 1';
var nameInp = el('input', { className: 'pax-name', type: 'text', placeholder: 'Passenger ' + (i + 1) + ' Full Name' });
var ageInp = el('input', { className: 'pax-age', type: 'number', placeholder: 'Age', min: '1', max: '120', style: 'max-width:110px;' });
if (existing[i]) {
nameInp.value = existing[i].name;
ageInp.value = existing[i].age;
}
box.appendChild(el('div', { className: 'form-row pax-row' }, [
el('span', { className: 'pax-badge', text: seatTag }),
nameInp,
ageInp
]));
}
}
renderPassengerFields();
function switchAuthTab(tab) {
document.getElementById('authMsg').textContent = '';
if (tab === 'login') {
document.getElementById('loginFormBox').classList.remove('hidden');
document.getElementById('regFormBox').classList.add('hidden');
document.getElementById('tabLoginBtn').classList.add('active');
document.getElementById('tabRegBtn').classList.remove('active');
} else {
document.getElementById('loginFormBox').classList.add('hidden');
document.getElementById('regFormBox').classList.remove('hidden');
document.getElementById('tabRegBtn').classList.add('active');
document.getElementById('tabLoginBtn').classList.remove('active');
}
}
function enterPortal(username) {
document.getElementById('page-login').classList.add('hidden');
document.getElementById('app-shell').classList.remove('hidden');
document.getElementById('activeUserLabel').textContent = username;
document.getElementById('welcomeUser').textContent = username;
navigateTo('hub');
loadSeats().then(function() { searchTrains(); });
}
function logoutUser() {
document.getElementById('app-shell').classList.add('hidden');
document.getElementById('page-login').classList.remove('hidden');
document.getElementById('loginPass').value = '';
document.getElementById('authMsg').textContent = '';
}
function navigateTo(viewName) {
['view-hub', 'view-book', 'view-pnr', 'view-cancel', 'view-routes'].forEach(function(id) {
document.getElementById(id).classList.add('hidden');
});
document.getElementById('view-' + viewName).classList.remove('hidden');
if (viewName === 'pnr') {
document.getElementById('pnrInput').value = '';
document.getElementById('pnrResult').style.display = 'none';
}
if (viewName === 'cancel') {
document.getElementById('cancelPnrInput').value = '';
document.getElementById('cancelResult').style.display = 'none';
}
if (viewName === 'book') {
  document.getElementById('ticketResult').style.display = 'none';
  loadSeats();
}

if (viewName === 'routes') {
exploreRoutes();
}
}
function submitLogin() {
var u = document.getElementById('loginUser').value.trim();
var p = document.getElementById('loginPass').value;
var msg = document.getElementById('authMsg');
msg.style.color = '#1d4ed8';
msg.textContent = 'Signing in...';
fetch('/api/login?user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p))
.then(function(r) { return r.json(); })
.then(function(data) {
if (data.success) { enterPortal(data.user); }
else { msg.style.color = '#b91c1c'; msg.textContent = data.message; }
})
.catch(function() { msg.style.color = '#b91c1c'; msg.textContent = 'Server connection failed.'; });
}
function submitRegister() {
var u = document.getElementById('regUser').value.trim();
var p = document.getElementById('regPass').value;
var c = document.getElementById('regConfirm').value;
var msg = document.getElementById('authMsg');
msg.style.color = '#15803d';
msg.textContent = 'Creating account...';
fetch('/api/register?user=' + encodeURIComponent(u) + '&pass=' + encodeURIComponent(p) + '&confirm=' + encodeURIComponent(c))
.then(function(r) { return r.json(); })
.then(function(data) {
if (data.success) { enterPortal(data.user); }
else { msg.style.color = '#b91c1c'; msg.textContent = data.message; }
})
.catch(function() { msg.style.color = '#b91c1c'; msg.textContent = 'Server connection failed.'; });
}
function updateSelectedSeatsLabel() {
var lbl = document.getElementById('selSeatLabel');
if (!lbl) return;
if (selectedSeats.length === 0) {
lbl.textContent = 'Auto-Assign / Waitlist (1 Ticket)';
} else {
lbl.textContent = selectedSeats.map(function(s) { return 'S1-' + s; }).join(', ') + ' (' + selectedSeats.length + ' Tickets)';
}
renderPassengerFields();
}
function loadSeats() {
var tName = selectedRoute ? selectedRoute.train : 'DEFAULT';
return fetch('/api/seats?train=' + encodeURIComponent(tName))
.then(function(res) { return res.json(); })
.then(function(data) {
var badge = document.getElementById('engineStatus');
badge.textContent = 'Server Online';
badge.classList.add('online');
var grid = document.getElementById('seatGrid');
grid.innerHTML = '';
data.seats.forEach(function(status, idx) {
var seatNo = idx + 1;
var isSel = selectedSeats.indexOf(seatNo) !== -1;
var div = el('div', {
className: 'seat ' + (status === 1 ? 'booked' : (isSel ? 'selected' : 'avail')),
text: 'S1-' + seatNo
});
if (status === 0) {
div.onclick = function() {
var pos = selectedSeats.indexOf(seatNo);
if (pos !== -1) selectedSeats.splice(pos, 1);
else selectedSeats.push(seatNo);
selectedSeats.sort(function(a, b) { return a - b; });
updateSelectedSeatsLabel();
loadSeats();
};
}
grid.appendChild(div);
});
});
}
function renderRouteCard(r, isSelected, onClickFn) {
return el('div', { className: 'route-card' + (isSelected ? ' selected' : ''), onclick: onClickFn }, [
el('strong', { text: r.train }),
el('span', { style: 'float:right; color:#15803d; font-weight:800;', text: 'Rs. ' + r.fare }),
el('div', { style: 'font-size:13px; color:#475569; margin-top:4px;', text: 'Timing: ' + r.startTime + ' - ' + r.endTime + ' | Distance: ' + r.distance + ' km' }),
el('div', { style: 'font-size:12px; color:#64748b; margin-top:2px;', text: 'Route: ' + r.path })
]);
}
function searchTrains() {
  document.getElementById('ticketResult').style.display = 'none';
var src = document.getElementById('srcSelect').value;
var dest = document.getElementById('destSelect').value;
var list = document.getElementById('routesList');
list.textContent = 'Searching trains...';
fetch('/api/routes?src=' + encodeURIComponent(src) + '&dest=' + encodeURIComponent(dest))
.then(function(res) { return res.json(); })
.then(function(data) {
list.innerHTML = '';
if (!data.routes || data.routes.length === 0) {
list.appendChild(el('p', { style: 'color:#b91c1c; font-weight:600;', text: 'No direct or connecting trains found between these stations.' }));
selectedRoute = null;
document.getElementById('selTrainLabel').textContent = 'None';
return;
}
data.routes.forEach(function(r, idx) {
var card = renderRouteCard(r, idx === 0, function() {
document.querySelectorAll('#routesList .route-card').forEach(function(c) { c.classList.remove('selected'); });
card.classList.add('selected');
selectedRoute = r;
selectedSeats = [];
document.getElementById('ticketResult').style.display = 'none';
document.getElementById('selTrainLabel').textContent = r.train;
updateSelectedSeatsLabel();
loadSeats();
});
list.appendChild(card);
if (idx === 0) {
selectedRoute = r;
document.getElementById('selTrainLabel').textContent = r.train;
loadSeats();
}
});
});
}
function exploreRoutes() {
var src = document.getElementById('expSrc').value;
var dest = document.getElementById('expDest').value;
var list = document.getElementById('exploreList');
list.textContent = 'Finding routes...';
fetch('/api/routes?src=' + encodeURIComponent(src) + '&dest=' + encodeURIComponent(dest))
.then(function(res) { return res.json(); })
.then(function(data) {
list.innerHTML = '';
if (!data.routes || data.routes.length === 0) {
list.appendChild(el('p', { style: 'color:#b91c1c; font-weight:600;', text: 'No route found between ' + src + ' and ' + dest + '.' }));
return;
}
data.routes.forEach(function(r) {
var card = renderRouteCard(r, false, function() {
document.getElementById('srcSelect').value = src;
document.getElementById('destSelect').value = dest;
selectedRoute = r;
navigateTo('book');
searchTrains();
});
list.appendChild(card);
});
});
}
function bookTicket() {
  if (!selectedRoute) { alert('Please select a train first!'); return; }
  var rows = document.querySelectorAll('#passengerInputsBox .pax-row');
  var passengers = [];
  for (var i = 0; i < rows.length; i++) {
    var name = rows[i].querySelector('.pax-name').value.trim();
    var age = rows[i].querySelector('.pax-age').value.trim();
    if (!name || !age) {
      alert('Please enter name and age for Passenger ' + (i + 1) + '!');
      return;
    }
    passengers.push({
      name: name,
      age: age,
      seat: selectedSeats.length > 0 ? selectedSeats[i] : 0
    });
  }

  var requests = passengers.map(function(p) {
    var url = '/api/book?name=' + encodeURIComponent(p.name) +
              '&age=' + encodeURIComponent(p.age) +
              '&src=' + encodeURIComponent(selectedRoute.src) +
              '&dest=' + encodeURIComponent(selectedRoute.dest) +
              '&train=' + encodeURIComponent(selectedRoute.train) +
              '&timing=' + encodeURIComponent(selectedRoute.startTime + ' - ' + selectedRoute.endTime) +
              '&seat=' + encodeURIComponent(p.seat) +
              '&fare=' + encodeURIComponent(selectedRoute.fare);
    return fetch(url).then(function(r) { return r.json(); });
  });

  Promise.all(requests).then(function(results) {
    var box = document.getElementById('ticketResult');
    box.innerHTML = '';
    box.className = 'result-banner eticket-box';
    box.style.display = 'block';
    box.style.background = '#f0fdf4';
    box.style.border = '2px dashed #15803d';
    box.style.color = '#14532d';

    box.appendChild(el('span', { className: 'eticket-tag', text: 'INDIAN RAILWAYS • CONFIRMED E-TICKET' }));
    box.appendChild(el('br'));

    results.forEach(function(data, idx) {
      if (idx > 0) box.appendChild(el('hr', { style: 'border:0; border-top:1px dashed #86efac; margin:10px 0;' }));
      if (data.success) {
        box.appendChild(el('strong', { text: passengers[idx].name + ' — ' + data.message }));
        box.appendChild(el('br'));
        box.appendChild(document.createTextNode('PNR Number: '));
        box.appendChild(el('strong', { text: String(data.pnr) }));
        box.appendChild(document.createTextNode('   |   Coach/Seat: '));
        box.appendChild(el('strong', { text: data.seat > 0 ? ('S1-' + data.seat) : 'WAITLISTED' }));
      } else {
        box.appendChild(el('strong', { style: 'color:#b91c1c;', text: passengers[idx].name + ': ' + data.message }));
      }
    });

    selectedSeats = [];
    updateSelectedSeatsLabel();
    loadSeats();
  });
}

function checkPNR() {
var pnr = document.getElementById('pnrInput').value.trim();
if (!pnr) { alert('Please enter a PNR number!'); return; }
fetch('/api/pnr?pnr=' + encodeURIComponent(pnr))
.then(function(res) { return res.json(); })
.then(function(data) {
var box = document.getElementById('pnrResult');
box.innerHTML = '';
box.style.display = 'block';
if (!data.found) {
box.style.background = '#fef2f2';
box.style.border = '1px solid #fca5a5';
box.style.color = '#991b1b';
box.appendChild(el('strong', { text: 'PNR ' + pnr + ' not found!' }));
} else {
box.style.background = '#eff6ff';
box.style.border = '1px solid #93c5fd';
box.style.color = '#1e3a8a';
box.appendChild(el('strong', { text: 'PNR ' + data.pnr + ' — Status: ' + data.status }));
box.appendChild(el('br'));
box.appendChild(document.createTextNode('Passenger: '));
box.appendChild(el('strong', { text: data.name }));
box.appendChild(document.createTextNode(' | Train: '));
box.appendChild(el('strong', { text: data.train }));
box.appendChild(document.createTextNode(' | Seat: '));
box.appendChild(el('strong', { text: data.seat > 0 ? ('S1-' + data.seat) : 'Waiting List' }));
}
});
}
function cancelPNR() {
var pnr = document.getElementById('cancelPnrInput').value.trim();
if (!pnr) { alert('Please enter a PNR number to cancel!'); return; }
fetch('/api/cancel?pnr=' + encodeURIComponent(pnr))
.then(function(res) { return res.json(); })
.then(function(data) {
var box = document.getElementById('cancelResult');
box.innerHTML = '';
box.style.display = 'block';
if (data.success) {
box.style.background = '#f0fdf4';
box.style.border = '1px solid #86efac';
box.style.color = '#14532d';
} else {
box.style.background = '#fef2f2';
box.style.border = '1px solid #fca5a5';
box.style.color = '#991b1b';
}
box.appendChild(el('strong', { text: data.message }));
loadSeats();
});
}

  function clearBookingForm() {
    var tr = document.getElementById('ticketResult');
    if (tr) tr.style.display = 'none';
    selectedSeats = [];
    var box = document.getElementById('passengerInputsBox');
    if (box) box.innerHTML = '';
    if (typeof updateSelectedSeatsLabel === 'function') updateSelectedSeatsLabel();
  }

  var origNav = navigateTo;
  navigateTo = function(viewName) {
    if (viewName === 'book') clearBookingForm();
    origNav(viewName);
  };

  var origSearch = searchTrains;
  searchTrains = function() {
    clearBookingForm();
    origSearch();
  };

  document.querySelectorAll('.card').forEach(function(c) {
    c.style.borderTop = '4px solid #1d4ed8';
    c.style.boxShadow = '0 10px 28px rgba(15, 37, 71, 0.08)';
  });

  var origLoadSeats = loadSeats;
  loadSeats = function() {
    return origLoadSeats().then(function() {
      var avail = document.querySelectorAll('#seatGrid .seat.avail').length;
      var sel = document.querySelectorAll('#seatGrid .seat.selected').length;
      var booked = document.querySelectorAll('#seatGrid .seat.booked').length;
      var banner = document.querySelector('.coach-banner');
      if (banner && banner.children[1]) {
